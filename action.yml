name: keypin rotate
description: Rotate due API keys with keypin, revoke the old keys approved on keypin.dev, and keep rotation state on a branch.
author: caiopizzol
branding:
  icon: refresh-cw
  color: gray-dark

inputs:
  op-service-account-token:
    description: Token of the 1Password service account that reads and writes the keys.
    required: true
  check-setup:
    description: true to check the setup with `keypin rotate --check`, and rotate nothing.
    default: "false"
  keypin-version:
    description: Exact keypin version to install.
    default: "0.46.1"
  state-branch:
    description: Branch that keeps `.keypin/rotation.json` and `status.json`.
    default: keypin/state

outputs:
  state-commit:
    description: Commit on the state branch this run saved or left as it was. Empty when nothing was saved.
    value: ${{ steps.save.outputs.commit }}

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/check-inputs.sh"'
      env:
        CHECK_SETUP: ${{ inputs.check-setup }}
        KEYPIN_VERSION: ${{ inputs.keypin-version }}
        STATE_BRANCH: ${{ inputs.state-branch }}
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-service-account-token }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Restore keypin state
      id: restore
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/restore-state.sh"'
      env:
        STATE_BRANCH: ${{ inputs.state-branch }}

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Install keypin
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/install-keypin.sh"'
      env:
        KEYPIN_VERSION: ${{ inputs.keypin-version }}

    - name: Get a GitHub token from keypin.dev
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/github-token.sh"'

    - name: Revoke the old keys approved on keypin.dev
      if: inputs.check-setup != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/claim-revokes.sh"'
      env:
        STATE_BRANCH: ${{ inputs.state-branch }}
        KEYPIN_1PASSWORD: service-account
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-service-account-token }}

    - name: Rotate
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/rotate.sh"'
      env:
        CHECK_SETUP: ${{ inputs.check-setup }}
        KEYPIN_1PASSWORD: service-account
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-service-account-token }}

    # The steps below run even when rotation failed, since keypin records what it did as it goes.
    - name: Stage keypin state
      id: stage
      if: always() && steps.restore.outcome == 'success'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/stage-state.sh"'
      env:
        RESTORED: ${{ steps.restore.outputs.commit }}

    - name: Keep a copy of keypin state
      if: always() && steps.stage.outputs.staged == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: keypin-state-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/keypin-rotate/state/
        retention-days: 90

    - name: Save keypin state
      id: save
      if: always() && steps.stage.outputs.staged == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/save-state.sh"'
      env:
        STATE_BRANCH: ${{ inputs.state-branch }}
        RESTORED: ${{ steps.restore.outputs.commit }}
        ARTIFACT: keypin-state-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Tell keypin.dev which old keys wait
      if: always() && inputs.check-setup != 'true' && steps.save.outcome == 'success'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/report.sh"'
      env:
        COMMIT: ${{ steps.save.outputs.commit }}
